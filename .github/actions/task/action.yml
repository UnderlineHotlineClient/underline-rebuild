name: task
description: Install Go and task at pinned versions
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: false
    - shell: sh
      run: go install github.com/go-task/task/v3/cmd/task@v3.53.1 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
