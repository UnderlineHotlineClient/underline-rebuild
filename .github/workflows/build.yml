name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Each job runs `task`. You can run the same commands on your computer.
# The free plan runs a maximum of five macOS jobs at the same time.
# The classic build uses three macOS jobs, one for each target.
# The Mac OS X build uses one macOS job, or two when you start the
# workflow manually.
# The ladder uses Linux runners only.
jobs:
  ladder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/task
      - run: task ladder:1

  classic:
    strategy:
      fail-fast: false
      matrix:
        target: [68K, PPC, Carbon]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/task
      - run: task build:classic TARGET=${{ matrix.target }}
      # Compare each program with the published program, byte for byte.
      # unar opens the published StuffIt archives.
      - run: brew install unar
      - run: task compare KIND=$(echo ${{ matrix.target }} | tr A-Z a-z) | tee compare.txt
      # A manual start makes a set of archives for a try on a Mac. It is
      # not a release: it has no signature.
      - if: github.event_name == 'workflow_dispatch'
        run: |
          cargo install stuffit --version 0.3.1 --locked
          task pack KIND=$(echo ${{ matrix.target }} | tr A-Z a-z)
          mv compare.txt "$RUNNER_TEMP/underline-rebuild/pack/compare-${{ matrix.target }}.txt"
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.target }}
          path: ${{ runner.temp }}/underline-rebuild/pack/
          retention-days: 1

  macosx:
    strategy:
      fail-fast: false
      matrix:
        # gcc 4.2 is an Intel program. It runs natively on Intel and with
        # Rosetta on arm. The arm job uses approximately twice the time, thus
        # it runs only when you start the workflow manually.
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["macos-15-intel","macos-latest"]' || '["macos-15-intel"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/task
      - run: task build:macosx
      # The job shows the result but does not fail. A PowerPC difference
      # from gcc 4.2 is not yet known.
      - run: task compare KIND=macosx | tee compare.txt
        continue-on-error: true
      - if: github.event_name == 'workflow_dispatch' && matrix.os == 'macos-15-intel'
        run: |
          task pack KIND=macosx
          mv compare.txt "$RUNNER_TEMP/underline-rebuild/pack/compare-MacOSX.txt"
      - if: github.event_name == 'workflow_dispatch' && matrix.os == 'macos-15-intel'
        uses: actions/upload-artifact@v4
        with:
          name: pack-MacOSX
          path: ${{ runner.temp }}/underline-rebuild/pack/
          retention-days: 1

  # After a manual start, put the archives, their SHA-256 values and the
  # results of the comparison on one GitHub pre-release. The pre-release has
  # no signature, thus it is not a release of Underline.
  rebuild:
    if: github.event_name == 'workflow_dispatch'
    needs: [classic, macosx]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          merge-multiple: true
          path: pack
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pack
          sha256sum *.sit *.zip > SHA256SUMS-1.9.6-rebuild
          {
            echo "These archives come from the Underline 1.9.6 source release, built again by run"
            echo "[${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            echo
            echo "**This is not a release of Underline. The archives have no signature.** The signed release is at https://199x.online/underline/."
            echo "Each archive has one program. Use the archives to try the programs from this build on a Mac."
            echo
            echo "Comparison with the published programs:"
            echo
            echo '```'
            cat compare-*.txt | grep '^compare:' | sed 's/^compare: //'
            echo '```'
          } > notes.md
          gh release delete 1.9.6-rebuild -R "${{ github.repository }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create 1.9.6-rebuild -R "${{ github.repository }}" --target "${{ github.sha }}" \
            --prerelease --title "1.9.6 rebuild (no signature)" --notes-file notes.md \
            *.sit *.zip SHA256SUMS-1.9.6-rebuild
